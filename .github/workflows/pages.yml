# アプリを GitHub Pages に公開する。
#
# 【重要】自動公開は無効にしてあります。
# push しても勝手には公開されません。公開したいときだけ、
# Actions タブ → このワークフロー → "Run workflow" を手で押してください。
#
# 自動公開に戻したいときは、下の `on:` に次の3行を足します。
#   push:
#     branches: [main]
#
# なお公開には Settings → Pages → Source を "GitHub Actions" にする設定も要ります。
# リポジトリが private の場合、GitHub Pages は有料プラン（Pro 以上）でのみ使えます。

name: Deploy Git Quest to Pages

# 手動実行のみ。push では動きません。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。進行中のものは走り切らせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 擬似 Git エンジンと全ステージのテスト
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
