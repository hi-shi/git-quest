# アプリを GitHub Pages に公開する。
#
# 公開ページには合言葉によるロックをかけられます（tools/set-password.mjs）。
# ただしあれは「よそ見防止」で、本物の認証ではありません。
# 秘密の情報はこのアプリに入れないでください。
#
# Pages の有効化はこのワークフローが自分で行います（configure-pages の enablement）。
# Settings → Pages を手で設定する必要はありません。
# リポジトリを private → public に切り替えると Pages の設定が外れることがあるため、
# 手動設定に頼らない形にしています。
#
# 公開を止めたいときは、下の `on:` から push の2行を消せば手動実行だけになります。
# 完全に止めるなら Settings → Pages で Source を None に戻してください。

name: Deploy Git Quest to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。進行中のものは走り切らせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 擬似 Git エンジンと全ステージのテスト
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Pages が未設定なら自動で有効化する（手動設定の取りこぼしを防ぐ）
          enablement: true

      # sw.js のバイト列が変わらないと、ブラウザは新しい版に気づかない。
      # 手でキャッシュ名を上げるのを忘れると「更新したのに古いまま」になるので、
      # 公開のたびにコミット SHA を埋めて必ず変わるようにする。
      - name: Service Worker のキャッシュ名にコミット SHA を埋める
        run: |
          sed -i "s/^const CACHE = .*/const CACHE = 'git-quest-${GITHUB_SHA::7}';/" sw.js
          grep -m1 '^const CACHE' sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
